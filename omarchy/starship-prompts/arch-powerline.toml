"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Fill keeps the right-hand details on the FIRST line in both Bash and Zsh.
# A native right_prompt would sit beside the second-line input in some shells.
format = """
[╭─](fg:#585858)\
$os\
$directory\
$git_branch\
$git_status\
$fill\
$status\
$character\
${custom.ssh_user}\
$hostname\
$time\
\n[╰─](fg:#585858) """

[fill]
symbol = ' '

[os]
disabled = false
format = '[](fg:#e4e4e4)[ $symbol ](fg:#1c1c1c bg:#e4e4e4)[](fg:#e4e4e4 bg:#5fafff)'

[os.symbols]
Arch = ''
Linux = ''

[directory]
style = 'bold fg:#eeeeee bg:#5fafff'
format = '[  $path$read_only ]($style)[](fg:#5fafff)'
truncation_length = 0
truncate_to_repo = false
home_symbol = '~'
read_only = ' '

[git_branch]
symbol = ''
style = 'fg:#1c1c1c bg:#3fb950'
format = '[ on  $symbol $branch(:$remote_branch)]($style)'

[git_status]
style = 'fg:#1c1c1c bg:#3fb950'
# Always close the Git segment, even in a clean repository.
format = '[ $all_status$ahead_behind]($style)[](fg:#3fb950)'
conflicted = '=${count} '
staged = '+${count} '
modified = '!${count} '
untracked = '?${count} '
renamed = '»${count} '
deleted = '✘${count} '
stashed = '≡${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '

[status]
disabled = false
map_symbol = false
symbol = '✗'
success_symbol = ''
style = 'fg:#1c1c1c bg:#ff6b6b'
format = '[](fg:#ff6b6b)[ $status $symbol ]($style)'

# A separate character module avoids showing a numeric zero on success.
# It is on the information line, not the command-input line.
[character]
success_symbol = '[ ✔](fg:#3fb950)'
error_symbol = ''
vimcmd_symbol = '[ ✔](fg:#3fb950)'
vimcmd_replace_one_symbol = '[ ✔](fg:#3fb950)'
vimcmd_replace_symbol = '[ ✔](fg:#3fb950)'
vimcmd_visual_symbol = '[ ✔](fg:#3fb950)'

# The built-in username also appears for local root/su sessions.
# Gate explicitly on SSH so both identity fields are SSH-only.
[custom.ssh_user]
when = 'test "${SSH_CONNECTION+x}" = x'
command = 'id -un'
shell = ['sh']
format = '[❮ with $output](fg:#af8700)'

[hostname]
ssh_only = true
ssh_symbol = ' 🌐'
trim_at = ''
format = '[@$hostname$ssh_symbol](fg:#af8700)'

[time]
disabled = false
time_format = '%H:%M:%S'
format = ' [](fg:#e4e4e4)[ at $time  ](fg:#303030 bg:#e4e4e4)[](fg:#e4e4e4)'
